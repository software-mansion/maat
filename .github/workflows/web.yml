name: Web

env:
  UV_FROZEN: 1

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      experiment_name:
        description: Optional experiment name (to be used by experiment workflow)
        required: false
        type: string
      notify_team:
        description: "Notify team (if you want the whole team to check the run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .tool-versions
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        id: deployment
        with:
          path: frontend/dist/

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
  notify-team:
    needs: deploy
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.experiment_name != '' && !contains(inputs.notify_team, 'false')}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync

      # Empty values when no analysis exists (or it can't be read), so the Slack workflow
      # still runs.
      - name: Read triage analysis
        id: analysis
        continue-on-error: true
        env:
          MAAT_SITE_URL: ${{ needs.deploy.outputs.page_url }}
          REPORT_NAME: ${{ github.event.inputs.experiment_name }}
        run: ./maat slack-fields "$REPORT_NAME" --output "$GITHUB_OUTPUT"

      - name: URL encode experiment name
        id: url-encode
        run: |
          ENCODED_NAME=$(echo -n ${{ toJSON(github.event.inputs.experiment_name) }} | jq -Rr @uri)
          echo "encoded_name=$ENCODED_NAME" >> $GITHUB_OUTPUT
      - name: Notifying the team about new report upload
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_NEW_MAAT_REPORT_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            {
              "url": "${{ needs.deploy.outputs.page_url }}#s=${{ steps.url-encode.outputs.encoded_name }}&p=${{ steps.url-encode.outputs.encoded_name }}",
              "report_name": "${{ github.event.inputs.experiment_name }}",
              "status": ${{ toJSON(steps.analysis.outputs.status) }},
              "summary": ${{ toJSON(steps.analysis.outputs.summary) }},
              "analysis_url": ${{ toJSON(steps.analysis.outputs.analysis_url) }},
              "thread_text": ${{ toJSON(steps.analysis.outputs.thread_text) }}
            }
